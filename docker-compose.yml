services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mastra
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
    ports:
      - "5432:5432"
    volumes:
      - mastra-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mastra-postgres:
