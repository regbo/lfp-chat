name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-npm-package
  cancel-in-progress: true

jobs:
  publish:
    name: Publish tagged version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tag
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package version from tag
        run: bun scripts/set-version-from-tag.ts "$GITHUB_REF_NAME"

      - name: Type-check package
        run: bun run typecheck

      - name: Verify package contents
        run: bun run pack:check

      - name: Set up npm publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Publish package
        working-directory: dist/package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an npm automation token as the NPM_TOKEN repository secret."
            exit 1
          fi
          npm publish --access public
