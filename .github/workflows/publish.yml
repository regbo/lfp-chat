name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish tagged version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package version from tag
        run: bun scripts/set-version-from-tag.ts "$GITHUB_REF_NAME"

      - name: Type-check package
        run: bun run typecheck

      - name: Verify package contents
        run: bun run pack:check

      - name: Publish package
        working-directory: dist/package
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then
            echo "::error::Add an npm automation token as the NPM_TOKEN repository secret."
            exit 1
          fi
          bun publish --access public
